<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quête Trigonométrique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
/* Layout: one centered game column (HUD strip, graph-paper canvas, touch pad) with full-screen cards for questions, boss fights and menus */
:root{
  --paper:#eef3ef;
  --ink:#1f2f42;
  --ink-2:#2b4058;
  --ink-soft:#52677d;
  --amber:#f0a83a;
  --teal:#2e8f83;
  --red:#d4483c;
  --good:#2f9a57;
  --plum:#7a4fb3;
  --page:#16202c;
  --page-text:#a9b8c6;
  --shadow:#0a1018;
  --card:#fbfdfb;
  --white:#ffffff;
  --line:#cbdad3;
  --empty:#3b5068;
  --scrim:rgba(20,31,44,.62);
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(ellipse at 50% -10%,#2a3d55 0%,transparent 60%);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 24px;
}
.game{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:6px;font-family:var(--display)}
.hud-world{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
.hud-world b{font-size:1.05rem;font-weight:700}
.hud-world small{font-family:var(--body);font-size:.78rem;opacity:.8}
.hearts{display:flex;gap:3px;align-items:center}
.heart .on{fill:var(--red)} .heart .off{fill:var(--empty)}
.xp{display:flex;align-items:center;gap:8px}
.xpbar{width:84px;height:12px;border:2px solid var(--paper);border-radius:2px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--amber);transition:width .35s}
.score{font-variant-numeric:tabular-nums}
.hud-btns{display:flex;gap:6px}
.icon-btn{font-family:var(--display);font-size:.9rem;background:transparent;color:var(--paper);border:2px solid var(--paper);border-radius:4px;min-width:36px;height:32px;cursor:pointer;padding:0 8px}
.icon-btn:hover{background:var(--ink-2)}
.icon-btn[aria-pressed="false"]{opacity:.55}

/* Stage */
.stage{position:relative;border:3px solid var(--ink);box-shadow:0 0 0 3px var(--amber),6px 6px 0 3px var(--shadow);background:var(--paper);border-radius:4px;overflow:hidden}
#cv{display:block;width:100%;touch-action:none}
.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-6px);background:var(--ink);color:var(--paper);font-family:var(--display);padding:6px 14px;border:2px solid var(--amber);border-radius:4px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.help{font-size:.85rem;color:var(--page-text);text-align:center;margin:0}
.help kbd{font-family:var(--display);background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:0 5px;font-size:.8rem;color:var(--ink)}

/* Touch pad */
.pad{display:none;justify-content:space-between;align-items:center;gap:12px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.touch .pad{display:flex}
.touch .help{display:none}
.pad-dir{display:flex;gap:10px}
.pbtn{width:76px;height:66px;font-family:var(--display);font-size:1.5rem;background:var(--card);color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--shadow);border-radius:12px;touch-action:none;-webkit-tap-highlight-color:transparent}
.pbtn.jump{width:120px;font-size:1.1rem;background:var(--amber)}
.pbtn.on{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);background:var(--line)}
.pbtn.jump.on{background:var(--amber);filter:brightness(.88)}

/* Overlays */
.ov{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov > *{margin-block:auto}
.card{background:var(--card);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);width:100%;max-width:620px;padding:22px;display:flex;flex-direction:column;gap:14px;border-radius:6px;min-width:0}
.card h2{font-family:var(--display);margin:0;font-size:1.6rem;line-height:1.1;text-wrap:balance}
.card p{margin:0}
.muted{color:var(--ink-soft)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{font-family:var(--display);font-size:1.05rem;padding:10px 18px;border:3px solid var(--ink);background:var(--white);color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;border-radius:6px}
.btn.primary{background:var(--amber)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,.choice:focus-visible,.wcard:focus-visible,.icon-btn:focus-visible,.pbtn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* Title */
.brand{font-family:var(--display);font-weight:700;line-height:.95;margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .3em}
.brand .q{font-size:clamp(1.3rem,5vw,2rem)}
.brand .e{display:inline-flex;font-size:clamp(1.3rem,5vw,2rem)}
.brand .e span{display:inline-block;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(-.14em)}50%{transform:translateY(.14em)}}
.brand .snow{font-size:clamp(1.1rem,4vw,1.6rem);margin-left:.2em}
.brand-sub{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--teal);font-family:var(--display);letter-spacing:.04em}
.brand-sub svg{flex:none}
.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.worlds .wcard:last-child:nth-child(odd){grid-column:1/-1}
.wcard{text-align:left;font:inherit;padding:12px;border:2px solid var(--ink);background:var(--white);border-radius:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;box-shadow:3px 3px 0 var(--ink);color:var(--ink);min-width:0}
.wcard:hover{background:var(--paper)}
.wcard .n{font-family:var(--display);font-size:.78rem;color:var(--teal);letter-spacing:.08em;text-transform:uppercase}
.wcard b{font-family:var(--display);font-size:1.08rem;font-weight:700;line-height:1.15}
.wcard small{color:var(--ink-soft);font-size:.82rem;line-height:1.35}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:.92rem}
.chip{width:18px;height:18px;border:2px solid var(--ink);border-radius:3px;display:grid;place-items:center;font-family:var(--display);font-size:.7rem;line-height:1}
.chip.qb{background:var(--amber)} .chip.en{background:var(--red);border-radius:9px 9px 3px 3px} .chip.cv{background:var(--teal)}

/* Questions */
.q-topic{font-family:var(--display);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.q-text{font-size:1.2rem;line-height:1.55;text-wrap:pretty}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice{display:flex;align-items:center;gap:10px;text-align:left;font:inherit;font-size:1.1rem;line-height:1.4;padding:10px 12px;background:var(--white);color:var(--ink);border:2px solid var(--ink);border-radius:6px;cursor:pointer;min-width:0;box-shadow:2px 2px 0 var(--ink)}
.choice .ct{min-width:0;overflow-wrap:anywhere}
.choice .key{font-family:var(--display);flex:none;width:26px;height:26px;display:grid;place-items:center;background:var(--ink);color:var(--paper);border-radius:4px;font-size:.85rem}
.choice:hover:not(:disabled){background:var(--paper)}
.choice:disabled{cursor:default}
.choice:disabled:not(.ok):not(.bad){opacity:.5}
.choice.ok{background:var(--good);border-color:var(--ink);color:var(--white)}
.choice.bad{background:var(--red);color:var(--white)}
.choice.ok .key,.choice.bad .key{background:var(--white);color:var(--ink)}
.feedback{border-top:2px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.verdict{font-family:var(--display);font-size:1.15rem;margin:0}
.verdict.ok{color:var(--good)} .verdict.bad{color:var(--red)}
.verdict small{font-family:var(--body);font-size:.9rem;color:var(--ink-soft);font-weight:400}
.expl{margin:0;background:var(--paper);border-left:4px solid var(--teal);padding:10px 12px;align-self:stretch;line-height:1.55}
sup{font-size:.7em;line-height:0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.88em;line-height:1.15;margin:0 .1em}
.fr > span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}
.qplot{margin-top:10px}
.qplot .plot{display:block;width:100%;max-width:400px;height:auto;border:2px solid var(--ink);border-radius:4px}
.choice .ct:has(.plot){flex:1}
.choice .ct .plot{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:3px}
.choice:has(.plot){padding:6px 8px;align-items:flex-start}

/* Minuterie + réglage */
.timer{display:flex;align-items:center;gap:10px;font-family:var(--display)}
.timer-bar{flex:1;height:12px;border:2px solid var(--ink);border-radius:3px;overflow:hidden;background:var(--paper)}
.timer-bar i{display:block;height:100%;width:100%;background:var(--teal);transition:width .1s linear}
.timer-num{min-width:3.5ch;text-align:right;font-variant-numeric:tabular-nums}
.timer.warn .timer-bar i{background:var(--red)}
.timer.warn .timer-num{color:var(--red)}
.setting{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.setting > span{font-family:var(--display);font-size:.95rem}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-family:var(--display);font-size:.9rem;padding:6px 12px;border:2px solid var(--ink);background:var(--white);color:var(--ink);border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* Boss arena */
.arena{background:var(--ink);color:var(--paper);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink-2);width:100%;max-width:660px;padding:18px;display:flex;flex-direction:column;gap:12px;border-radius:6px;min-width:0}
.arena.hit{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.arena-top{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.boss-name{font-family:var(--display);font-size:1.25rem;color:var(--amber);line-height:1.1}
.bhp{display:flex;gap:4px;align-items:center;font-family:var(--display);font-size:.8rem}
.bhp i{width:22px;height:12px;background:var(--red);border:2px solid var(--paper);border-radius:2px}
.bhp i.gone{background:transparent;opacity:.4}
.arena-mid{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
#bossCv{width:240px;height:180px;max-width:100%;image-rendering:pixelated}
.arena .log{font-family:var(--display);text-align:center;min-height:1.4em;font-size:1.02rem}
.arena .you{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--display);font-size:.85rem}
.arena .card{box-shadow:none;max-width:none;border-color:var(--amber);color:var(--ink)}

/* Memo + stats */
.memo{display:grid;gap:4px;font-size:.96rem}
.memo h3{font-family:var(--display);margin:8px 0 2px;font-size:1rem;color:var(--teal)}
.memo ul{margin:0;padding-left:1.2em;display:grid;gap:3px}
.tablewrap{overflow-x:auto}
.stats{width:100%;border-collapse:collapse;font-size:.95rem}
.stats th,.stats td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.stats td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats th{font-family:var(--display);font-weight:500;font-size:.85rem;color:var(--ink-soft)}
.tag{font-family:var(--display);font-size:.75rem;padding:2px 6px;border-radius:3px;white-space:nowrap}
.tag.low{background:var(--red);color:var(--white)} .tag.okk{background:var(--good);color:var(--white)}
.big{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--teal)}

@media (max-width:620px){
  .worlds{grid-template-columns:minmax(0,1fr)}
  .choices{grid-template-columns:minmax(0,1fr)}
  .card{padding:18px}
  .q-text{font-size:1.1rem}
  .xpbar{width:60px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* ===== Mode course et multijoueur ===== */
.chrono{font-family:var(--display);font-size:1.1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.chrono.turbo{color:var(--amber)}
.countdown{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:clamp(3rem,14vw,7rem);color:#fff;text-shadow:4px 4px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;pointer-events:none}
.countdown.pop{animation:cdpop .9s ease-out}
@keyframes cdpop{0%{transform:scale(1.8);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.92);opacity:.85}}
.race-board{position:absolute;left:8px;top:8px;background:rgba(8,12,20,.74);color:#fff;border-radius:6px;padding:6px 8px;font-family:var(--display);font-size:.76rem;display:grid;gap:3px;min-width:150px;max-width:48%;pointer-events:none}
.race-board .rb{display:grid;grid-template-columns:1.1em 8px minmax(0,1fr) auto;gap:6px;align-items:center}
.race-board .dot{width:8px;height:8px;border-radius:50%}
.race-board .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.race-board .me .nm{text-decoration:underline}
.race-board .bar{width:54px;height:6px;background:rgba(255,255,255,.22);border-radius:3px;overflow:hidden}
.race-board .bar i{display:block;height:100%;background:#fff}
.race-board .tm{font-variant-numeric:tabular-nums}
.mp-code{font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,12vw,4rem);letter-spacing:.3em;text-align:center;padding:4px 0 4px .3em;border:3px dashed currentColor;border-radius:8px;user-select:all}
.field{display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-size:.9rem}
.field input{font-family:var(--body);font-size:1.1rem;padding:8px 10px;border:2px solid currentColor;border-radius:6px;background:transparent;color:inherit;min-width:0;width:100%}
.field input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.mp-split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mp-box{border:2px dashed currentColor;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.mp-box .field{align-self:stretch}
.mp-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px}
.mp-list li{display:flex;align-items:center;gap:6px;font-family:var(--display)}
.mp-list i{width:10px;height:10px;border-radius:50%;display:inline-block}
.mp-err{color:var(--red);font-weight:700}
.mp-results{width:100%;border-collapse:collapse;font-size:.98rem}
.mp-results td{padding:7px 6px;border-bottom:1px solid rgba(127,127,127,.35)}
.mp-results td.r{font-family:var(--display);width:2em}
.mp-results td.t{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mp-results tr.win td{font-weight:700}
.mp-results .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.duo .help,.duo .pad{display:none!important}
.duo body{padding-block:6px}
.duo .game{gap:6px}
@media (max-width:620px){.mp-split{grid-template-columns:minmax(0,1fr)}}

/* ===== Pièces et boutique ===== */
.coins{display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.coin-ic{display:inline-block;width:12px;height:12px;border-radius:50%;background:#f5c518;box-shadow:inset -2px -2px 0 #c99a00,0 0 0 1px #8a5d00;flex:none}
.coin-ic.big{width:20px;height:20px;box-shadow:inset -3px -3px 0 #c99a00,0 0 0 2px #8a5d00}
.chip.co{background:#f5c518;border-radius:50%}
.wallet{font-family:var(--display);font-size:1.3rem;display:flex;align-items:center;gap:10px;margin:0}
.shop-msg{font-family:var(--display);color:var(--teal);margin:0}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.sk-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border:2px solid rgba(127,127,127,.45);border-radius:8px;background:rgba(127,127,127,.1);min-width:0;text-align:center}
.sk-item.on{border-color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber)}
.sk-item canvas{width:72px;height:84px;image-rendering:pixelated}
.sk-item b{font-family:var(--display);font-size:.95rem;line-height:1.1}
.sk-item .price{font-family:var(--display);font-size:.82rem;display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap}
.sk-item .btn{font-size:.85rem;padding:6px 8px;width:100%;margin-top:auto}
.sk-item .btn:disabled{opacity:.55;cursor:default}
</style>
</head>
<body>
<div class="game" id="game">
  <header class="hud" aria-label="État du jeu">
    <div class="hud-world"><b id="hudWorld">Monde 1</b><small id="hudWorldTitle">La plaine du cercle</small></div>
    <div class="hearts" id="hudHearts"></div>
    <div class="xp"><span>Niv. <b id="hudLvl">1</b></span><div class="xpbar" title="Expérience"><i id="hudXp"></i></div></div>
    <div class="coins" title="Pièces"><i class="coin-ic"></i><b id="hudCoins">0</b></div>
    <div class="score" title="Bonnes réponses">✓ <b id="hudOk">0</b>/<span id="hudTot">0</span></div>
    <div class="chrono" id="hudTime" hidden aria-live="off">0:00,0</div>
    <div class="hud-btns">
      <button class="icon-btn" id="btnMusic" aria-pressed="true" aria-label="Musique activée" title="Musique">♫</button>
      <button class="icon-btn" id="btnSound" aria-pressed="true" aria-label="Effets sonores activés" title="Effets sonores">♪</button>
      <button class="icon-btn" id="btnPause" aria-label="Pause et aide-mémoire">II</button>
      <button class="icon-btn" id="btnHome" hidden aria-label="Changer de jeu" title="Changer de jeu">⌂</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Niveau de plateformes"></canvas>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="countdown" id="countdown" hidden aria-live="assertive"></div>
    <div class="race-board" id="raceBoard" hidden></div>
  </div>

  <div class="pad" id="pad">
    <div class="pad-dir">
      <button class="pbtn" data-k="left" aria-label="Aller à gauche">◀</button>
      <button class="pbtn" data-k="right" aria-label="Aller à droite">▶</button>
    </div>
    <button class="pbtn jump" data-k="jump" aria-label="Sauter">SAUTER</button>
  </div>
  <p class="help"><kbd>←</kbd> <kbd>→</kbd> bouger · <kbd>Espace</kbd> ou <kbd>↑</kbd> sauter · <kbd>1</kbd>–<kbd>4</kbd> répondre · <kbd>Échap</kbd> pause</p>
</div>

<div class="ov" id="qov" hidden><div class="card" id="qcard" role="dialog" aria-modal="true" aria-label="Question"></div></div>

<div class="ov" id="bov" hidden>
  <div class="arena" id="arena" role="dialog" aria-modal="true" aria-label="Combat de boss">
    <div class="arena-top">
      <div class="boss-name" id="bossName"></div>
      <div class="bhp" id="bossHp"></div>
    </div>
    <div class="arena-mid">
      <canvas id="bossCv" width="160" height="120"></canvas>
      <div class="you"><span>Toi</span><div class="hearts" id="bossHearts"></div></div>
    </div>
    <div class="log" id="bossLog" aria-live="polite"></div>
    <div class="card" id="bossQ"></div>
  </div>
</div>

<div class="ov" id="mov"><div class="card" id="mcard" role="dialog" aria-modal="true"></div></div>

<script>

const MEMO = `<div class="memo">
  <h3>Cercle trigonométrique</h3>

  <li><i>P</i>(<i>θ</i>) = (cos <i>θ</i>, sin <i>θ</i>) et tan <i>θ</i> = <span class="fr"><span>sin <i>θ</i></span><span>cos <i>θ</i></span></span></li>
  <li><i>P</i>(<span class="fr"><span>π</span><span>6</span></span>) = (<span class="fr"><span>√3</span><span>2</span></span>, <span class="fr"><span>1</span><span>2</span></span>); <i>P</i>(<span class="fr"><span>π</span><span>4</span></span>) = (<span class="fr"><span>√2</span><span>2</span></span>, <span class="fr"><span>√2</span><span>2</span></span>); <i>P</i>(<span class="fr"><span>π</span><span>3</span></span>) = (<span class="fr"><span>1</span><span>2</span></span>, <span class="fr"><span>√3</span><span>2</span></span>)</li>

  <li>Longueur d'arc : <i>L</i> = <i>θr</i> (<i>θ</i> en radians). Angles coterminaux : <i>θ</i> + 2π<i>n</i></li></ul>
  <h3>Identités</h3>
  <ul><li>sec <i>θ</i> = <span class="fr"><span>1</span><span>cos <i>θ</i></span></span>, cosec <i>θ</i> = <span class="fr"><span>1</span><span>sin <i>θ</i></span></span>, cotan <i>θ</i> = <span class="fr"><span>cos <i>θ</i></span><span>sin <i>θ</i></span></span></li>

  <li>Règle à partir du graphique : |<i>a</i>| = <span class="fr"><span>max − min</span><span>2</span></span>, <i>k</i> = <span class="fr"><span>max + min</span><span>2</span></span>, |<i>b</i>| = <span class="fr"><span>2π</span><span>période</span></span></li>
  <li>(<i>h</i>, <i>k</i>) : point sur l'axe où la sinusoïde monte (sinus, <i>a</i> &gt; 0) ou point le plus haut (cosinus, <i>a</i> &gt; 0)</li>
  <li>cos <i>x</i> = sin(<i>x</i> + <span class="fr"><span>π</span><span>2</span></span>)</li></ul>
  <h3>Équations et inéquations</h3>

function drawHero(c, x, y, f, pal, st){
  const px = (dx, dy, w, h, col) => { c.fillStyle = col; c.fillRect(f > 0 ? x + dx : x + 12 - dx - w, y + dy, w, h); };
  const t = st.t || 0, rb = pal.deco === 'rainbow';
  const sh = rb ? `hsl(${(t * 5) % 360} 80% 55%)` : pal.shirt, shHi = rb ? `hsl(${(t * 5 + 50) % 360} 90% 72%)` : pal.shirtHi;
  const cap = rb ? `hsl(${(t * 5 + 180) % 360} 80% 55%)` : pal.cap;
  if (st.horror){ px(1, 0, 9, 3, cap); px(4, -2, 3, 2, pal.capHi); }
  else { px(1, 0, 9, 3, cap); px(8, 2, 4, 1, cap); px(1, 0, 9, 1, pal.capHi); }
  px(1, 3, 2, 3, pal.hair); px(3, 3, 7, 4, pal.skin); px(7, 4, 1, 2, pal.eye);
  px(2, 7, 8, 5, sh); px(2, 7, 8, 1, shHi);
  if (st.horror){ px(st.walking && st.ph ? 9 : 10, 8, 2, 2, pal.skin); px(11, 9, 3, 4, '#ffd36b'); px(11, 8, 3, 1, '#2a2233'); px(12, 7, 1, 1, '#2a2233'); }
  else px(st.walking && st.ph ? 8 : 9, 8, 2, 3, pal.skin);

/* ================== Réseau robuste : relais Internet (MQTT) + connexion directe (WebRTC) ================== */
// Chaque joueur essaie les deux chemins en même temps et garde le premier qui fonctionne.
// Relais : les messages passent par des serveurs publics (WebSocket sécurisé) ; fonctionne presque partout.
// Direct : plus rapide, mais souvent bloqué par les réseaux d'école.
const NETCFG = Object.assign({
  brokers: ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081/mqtt'],
  peer: null, noPeer: false,

    { urls:'turn:openrelay.metered.ca:80', username:'openrelayproject', credential:'openrelayproject' },
    { urls:'turn:openrelay.metered.ca:443', username:'openrelayproject', credential:'openrelayproject' },
    { urls:'turn:openrelay.metered.ca:443?transport=tcp', username:'openrelayproject', credential:'openrelayproject' }
  ]
}, window.QE_NET || {});
const NETLIBS = { peer: window.QE_PEER_URL || 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js', mqtt: window.QE_MQTT_URL || 'https://cdn.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js' };
function loadScript(src, ok){
  return new Promise(res => {
    if (ok()) return res(true);
    const s = document.createElement('script'); s.src = src;
    s.onload = () => res(ok()); s.onerror = () => res(false);
    document.head.appendChild(s); setTimeout(() => res(ok()), 15000);
  });
}
function loadNetLibs(){
  return Promise.all([
    NETCFG.noPeer ? false : loadScript(NETLIBS.peer, () => typeof Peer !== 'undefined'),
    NETCFG.brokers.length ? loadScript(NETLIBS.mqtt, () => typeof mqtt !== 'undefined') : false

}
function makeNet(){
  const TOPIC = 'quete-trigo-qc/', PFX = 'quete-trigo-';
  const st = { peer:null, clients:[], timers:[], closed:false, link:null, guests:{} };
  const hasPeer = () => typeof Peer !== 'undefined' && !NETCFG.noPeer;
  const hasMqtt = () => typeof mqtt !== 'undefined' && NETCFG.brokers.length > 0;
  const peerOpts = () => Object.assign({ config:{ iceServers:NETCFG.ice }, debug:0 }, NETCFG.peer || {});
  const later = (fn, ms) => { const t = setTimeout(fn, ms); st.timers.push(t); return t; };
  const rid = () => Math.random().toString(36).slice(2, 10);
  function makeLink(kind, sendFn, closeFn){
    const L = { kind, h:{}, alive:true, lastIn:Date.now(),
      on(e, f){ (L.h[e] = L.h[e] || []).push(f); return L; },
      emit(e, a){ (L.h[e] || []).slice().forEach(f => { try { f(a); } catch (err) { console.error(err); } }); },
      send(o){ if (L.alive){ try { sendFn(o); } catch (_) {} } },

    c.on('connect', () => { if (!done){ done = true; onReady(c); } });

      if (!L.alive){ clearInterval(hb); return; }
      try { pub({ k:'hb' }); } catch (_) {}
      if (Date.now() - L.lastIn > 9000){ clearInterval(hb); L.alive = false; L.emit('close'); }
    }, 2000);

    available(){ return hasPeer() || hasMqtt(); },
    // Héberger : onCode(code) dès qu'au moins un chemin est prêt ; onGuest(lien) pour chaque joueur qui arrive
    host(onCode, onGuest, onFail){
      st.closed = false; st.guests = {};
      const code = Array.from({ length:4 }, () => 'ABCDEFGHJKMNPQRSTUVWXYZ'[Math.floor(Math.random() * 23)]).join('');
      let ready = 0, failed = 0, total = 0;
      const okOne = () => { if (++ready === 1 && !st.closed) onCode(code); };
      const failOne = () => { if (++failed === total && !ready && !st.closed) onFail('Impossible de joindre les serveurs de jeu. Vérifie la connexion Internet (ou essaie le partage de connexion d’un cellulaire).'); };
      // Un joueur peut arriver par les deux chemins : on regroupe ses liens et on répond par le plus récent.
      const attach = (gid, L) => {

        else { st.clients.forEach(c => { try { c.publish(hostBox, JSON.stringify({ k:'bye', from:id })); c.end(); } catch (_) {} }); st.clients = []; }

        try {
          const p = new Peer(undefined, peerOpts()); st.peer = p;
          p.on('open', () => { const conn = p.connect(PFX + code.toLowerCase(), { reliable:true, serialization:'json', metadata:{ id } }); conn.on('open', () => adopt(directLink(conn))); });
          p.on('error', e => { if (e && e.type === 'peer-unavailable') giveUp(); });
        } catch (_) { giveUp(); }
      }
      if (!pending) onFail('Le mode en ligne demande une connexion Internet.');
      later(() => { if (!st.link && !st.closed) onStatus('La connexion prend du temps… Si rien ne se passe, vérifie le code, ou essaie le partage de connexion d’un cellulaire.'); }, 14000);
    },
    close(){
      st.closed = true; st.timers.forEach(t => clearTimeout(t)); st.timers = [];
      try { if (st.link) st.link.close(); } catch (_) {}
      Object.values(st.guests).forEach(g => { try { g.close(); } catch (_) {} }); st.guests = {};
      try { if (st.peer) st.peer.destroy(); } catch (_) {}
      const cs = st.clients; st.clients = []; st.peer = null; st.link = null;
      setTimeout(() => cs.forEach(c => { try { c.end(true); } catch (_) {} }), 300);
    }
  };
  return API;
}

/* ================== Course en ligne (salle, course, résultats) ================== */
const MP = { role:null, net:null, links:{}, conn:null, code:'', name:'', players:{}, world:0, joined:false, ended:false, pump:null, myId:'me' };
const EDITION = 'trigo';
const EDITION_NAME = { trigo:'Quête Trigonométrique', 'trigo-fetes':'Quête Trigonométrique (temps des fêtes)', classic:'Quête Exponentielle', horror:'Le Manoir Exponentiel' };
const savedName = () => { try { return localStorage.getItem('qt-name') || ''; } catch (_) { return ''; } };
const kindLabel = k => k === 'direct' ? 'connexion directe' : 'relais Internet';
function mpCleanup(){
  if (MP.pump){ clearInterval(MP.pump); MP.pump = null; }
  const net = MP.net;
  Object.assign(MP, { role:null, net:null, links:{}, conn:null, code:'', players:{}, joined:false, ended:false, myId:'me' });
  try { if (net) net.close(); } catch (_) {}
}
function mpMenu(msg){
  state = 'menu';
  showCard(`<div class="q-topic">Multijoueur</div><h2>Course en ligne</h2>
    <p>Chaque joueur utilise son propre appareil, avec le même jeu (${EDITION_NAME[EDITION]}). Tout le monde reçoit les mêmes questions. Le premier qui bat le boss gagne. Il faut une connexion Internet.</p>
    ${msg ? `<p class="mp-err" role="alert">${msg}</p>` : ''}
    <label class="field"><span>Ton nom</span><input id="mpName" maxlength="12" autocomplete="off" value="${esc(savedName())}" placeholder="Ex. : Léa"></label>
    <div class="mp-split">
      <div class="mp-box"><b>Créer une partie</b><p class="muted">Tu reçois un code à donner aux autres joueurs.</p><button class="btn primary" data-act="mp-host">Créer</button></div>
      <div class="mp-box"><b>Rejoindre une partie</b><label class="field"><span>Code</span><input id="mpCode" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" style="text-transform:uppercase;letter-spacing:.2em"></label><button class="btn" data-act="mp-join">Rejoindre</button></div>
    </div>
    <p class="muted" style="font-size:.88rem">Pendant la course : une bonne réponse donne un turbo de 6 secondes. Si tu perds tous tes cœurs, tu repars avec 15 secondes de pénalité.</p>
    <div class="row"><button class="btn" data-act="mp-back">← Retour</button></div>`);
}
function mpStatus(msg, sub){ state = 'menu'; showCard(`<div class="q-topic">Course en ligne</div><h2>${msg}</h2>${sub ? `<p class="muted">${sub}</p>` : ''}<div class="row"><button class="btn" data-act="mp-quit">Annuler</button></div>`); }
function mpLost(msg){ mpCleanup(); raceStop(); state = 'menu';
  showCard(`<div class="q-topic">Course en ligne</div><h2>Partie interrompue</h2><p>${msg}</p><div class="row"><button class="btn primary" data-act="online">Course en ligne</button><button class="btn" data-act="mp-back">Menu</button></div>`); }
function readName(){
  const v = (($('#mpName') || {}).value || '').trim().slice(0, 12);
  if (v){ try { localStorage.setItem('qt-name', v); } catch (_) {} }
  return v;
}
function playerList(){ return Object.entries(MP.players).map(([id, p]) => ({ id, ...p })); }
function lobbyHTML(isHost){
  const list = playerList().map(p => `<li><i style="background:${p.color}"></i>${esc(p.name)}</li>`).join('');
  const W = WORLDS[MP.world] || WORLDS[0];
  return `<div class="q-topic">Course en ligne · ${isHost ? 'tu es l’hôte' : 'connecté (' + kindLabel(MP.conn && MP.conn.kind) + ')'}</div><h2>Code de la partie</h2>
    <div class="mp-code">${MP.code}</div>
    ${isHost ? `<p class="muted">Les autres joueurs ouvrent ${EDITION_NAME[EDITION]}, choisissent « Course en ligne » et tapent ce code.</p>
      <div class="setting"><span>Monde</span><div class="seg" role="group" aria-label="Monde de la course">${WORLDS.map((w, i) => `<button data-act="mp-world" data-w="${i}" aria-pressed="${i === MP.world}">${w.ext ? 'Extension' : w.name}</button>`).join('')}</div></div>`
      : `<p>Monde : <b>${W.name} · ${W.title}</b></p>`}
    <p style="margin:0"><b>Joueurs (${playerList().length}/8)</b></p><ul class="mp-list">${list}</ul>
    <div class="row">${isHost ? '<button class="btn primary" data-act="mp-start">Lancer la course</button>' : '<span class="muted">En attente du lancement par l’hôte…</span>'}<button class="btn" data-act="mp-quit">Quitter</button></div>`;
}
function mpShowLobby(){ state = 'menu'; showCard(lobbyHTML(MP.role === 'host')); }
function mpBroadcast(msg){ Object.values(MP.links).forEach(g => g.send(msg)); }
function lobbyMsg(){ return { t:'lobby', code:MP.code, world:MP.world, edition:EDITION, players:MP.players }; }
function mpLobbyRefresh(){
  if (MP.role !== 'host') return;
  mpBroadcast(lobbyMsg());
  if (!RACE.on && state === 'menu' && mcard.querySelector('.mp-code')) mpShowLobby();
}
async function mpHost(name){
  mpStatus('Création de la partie…');
  await loadNetLibs();
  mpCleanup();
  const net = makeNet();
  if (!net.available()) return mpMenu('Impossible de charger le module en ligne. Vérifie la connexion Internet.');
  Object.assign(MP, { role:'host', net, name, world, links:{}, players:{ me:{ name, color:GHOST_COLORS[0] } }, myId:'me' });
  net.host(
    code => { if (MP.net !== net) return; MP.code = code; mpShowLobby(); if (!MP.pump) MP.pump = setInterval(mpPump, 200); },
    g => {
      if (MP.net !== net){ g.close(); return; }
      MP.links[g.gid] = g;
      g.on('data', d => mpHostData(g, d));
      g.on('close', () => { if (MP.links[g.gid] === g) delete MP.links[g.gid]; if (MP.players[g.gid]){ delete MP.players[g.gid]; mpLobbyRefresh(); } });
    },
    msg => { if (MP.net === net){ mpCleanup(); mpMenu(msg); } }
  );
}
function mpHostData(g, d){
  if (!d || typeof d !== 'object') return;
  const gid = g.gid;
  if (d.t === 'hello'){
    if (MP.players[gid]){ g.send({ t:'welcome', id:gid, edition:EDITION }); g.send(lobbyMsg()); return; }
    if (RACE.on){ g.send({ t:'busy' }); return; }
    if (playerList().length >= 8){ g.send({ t:'full' }); return; }
    const used = playerList().map(p => p.color), color = GHOST_COLORS.find(c => !used.includes(c)) || GHOST_COLORS[7];
    MP.players[gid] = { name:String(d.name || 'Joueur').slice(0, 12), color };
    g.send({ t:'welcome', id:gid, edition:EDITION });
    mpLobbyRefresh();
  } else if (d.t === 'pos' && MP.players[gid] && d.s){
    const s = d.s, p = MP.players[gid];
    for (const k of ['x', 'y', 'f', 'w', 'prog', 'phase', 'time', 'ok', 'tot', 'sk']) if (k in s) p[k] = s[k];
  } else if (d.t === 'bye'){
    if (MP.players[gid]){ delete MP.players[gid]; mpLobbyRefresh(); }
  }
}
function mpPump(){
  if (MP.role !== 'host' || !RACE.on) return;
  mpBroadcast({ t:'state', players:MP.players });
  mpView(MP.players, 'me');
  const all = playerList();
  if (!MP.ended && all.length && all.every(p => p.phase === 'done')) mpEnd();
}
function mpEnd(){
  if (MP.role !== 'host' || MP.ended) return;
  MP.ended = true; mpBroadcast({ t:'results', players:MP.players }); mpResults(MP.players, 'me');
}
function mpView(players, myId){
  RACE.ghosts = Object.entries(players).filter(([id]) => id !== myId).map(([, p]) => ({ name:p.name, color:p.color, x:p.x, y:p.y, w:p.w, phase:p.phase, f:p.f, sk:p.sk }));
  const arr = Object.entries(players).map(([id, p]) => ({ id, ...p })).sort(rankSort);
  const b = $('#raceBoard'); b.hidden = false;
  b.innerHTML = arr.map((p, i) => `<div class="rb${p.id === myId ? ' me' : ''}"><span>${i + 1}</span><span class="dot" style="background:${p.color}"></span><span class="nm">${esc(p.name)}</span>${p.phase === 'done' ? `<span class="tm">${fmtTime(p.time || 0)}</span>` : p.phase === 'boss' ? '<span>BOSS</span>' : `<span class="bar"><i style="width:${Math.round((p.prog || 0) * 100)}%"></i></span>`}</div>`).join('');
}
function rankSort(a, b){
  const da = a.phase === 'done', db = b.phase === 'done';
  if (da !== db) return da ? -1 : 1;
  if (da) return (a.time || 0) - (b.time || 0);
  const ba = a.phase === 'boss', bb = b.phase === 'boss';
  if (ba !== bb) return ba ? -1 : 1;
  return (b.prog || 0) - (a.prog || 0);
}
function mpResults(players, myId){
  state = 'menu'; $('#qov').hidden = true; $('#bov').hidden = true; activeAnswer = null; stopTimer();
  const arr = Object.entries(players).map(([id, p]) => ({ id, ...p })).sort(rankSort);
  const medal = ['1<sup>er</sup>', '2<sup>e</sup>', '3<sup>e</sup>'];
  const rows = arr.map((p, i) => `<tr class="${i === 0 && p.phase === 'done' ? 'win' : ''}"><td class="r">${medal[i] || (i + 1) + '<sup>e</sup>'}</td><td><span class="dot" style="background:${p.color}"></span>${esc(p.name)}${p.id === myId ? ' (toi)' : ''}</td><td class="t">${p.phase === 'done' ? fmtTime(p.time || 0) : `Pas terminé (${Math.round((p.prog || 0) * 100)} %)`}</td><td class="t">${p.ok || 0}/${p.tot || 0}</td></tr>`).join('');
  const win = arr[0] && arr[0].phase === 'done' ? arr[0] : null;
  showCard(`<div class="q-topic">Course en ligne · résultats</div><h2>${win ? (win.id === myId ? 'Tu as gagné !' : esc(win.name) + ' gagne !') : 'Course terminée'}</h2>
    <div class="tablewrap"><table class="mp-results"><tbody>${rows}</tbody></table></div>
    <p class="muted" style="font-size:.88rem">Temps (pénalités comprises) et bonnes réponses.</p>
    <div class="row">${MP.role === 'host' ? '<button class="btn primary" data-act="mp-again">Nouvelle course</button>' : '<span class="muted">L’hôte peut lancer une nouvelle course.</span>'}<button class="btn" data-act="mp-quit">Quitter</button></div>`);
}
function mpStartRace(){
  if (MP.role !== 'host') return;
  const seed = (Math.random() * 4294967296) >>> 0;
  MP.ended = false;
  for (const p of Object.values(MP.players)) Object.assign(p, { prog:0, phase:'wait', time:0, ok:0, tot:0, x:null, y:null, w:MP.world });
  mpBroadcast({ t:'start', world:MP.world, seed });
  raceStart({ world:MP.world, seed, label:'' });
  RACE.onUpdate = s => Object.assign(MP.players.me, s);
  mpView(MP.players, 'me');
}
async function mpJoin(name, raw){
  const code = String(raw || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (code.length !== 4) return mpMenu('Le code de la partie contient 4 lettres.');
  mpStatus('Connexion à la partie ' + code + '…');
  await loadNetLibs();
  mpCleanup();
  const net = makeNet();
  if (!net.available()) return mpMenu('Impossible de charger le module en ligne. Vérifie la connexion Internet.');
  Object.assign(MP, { role:'client', net, code, name });
  net.join(code,
    L => {
      if (MP.net !== net) return;
      MP.conn = L;
      L.on('data', d => mpClientData(d));
      L.on('close', () => { if (MP.conn === L && MP.role === 'client') mpLost('La connexion avec l’hôte a été perdue.'); });
      L.send({ t:'hello', name, edition:EDITION });
      mpStatus('Connecté (' + kindLabel(L.kind) + ') !', 'Entrée dans la salle…');
    },
    msg => { if (MP.net === net && !MP.conn) mpStatus('Connexion à la partie ' + code + '…', msg); },
    msg => { if (MP.net === net && !MP.conn){ mpCleanup(); mpMenu(msg); } }
  );
}
function mpClientData(d){
  if (!d || typeof d !== 'object' || MP.role !== 'client') return;
  if (d.t === 'welcome'){
    if (d.edition !== EDITION){ mpCleanup(); return mpMenu(`Cette partie a été créée dans « ${EDITION_NAME[d.edition] || 'l’autre jeu'} ». Ouvre ce jeu pour la rejoindre.`); }
    MP.joined = true; MP.myId = d.id;
  } else if (d.t === 'lobby'){
    MP.players = d.players || {}; MP.world = d.world || 0;
    if (RACE.on) raceStop();
    if (MP.joined) mpShowLobby();
  } else if (d.t === 'start'){
    raceStart({ world:d.world, seed:d.seed, label:'' });
    RACE.onUpdate = s => { if (MP.conn) MP.conn.send({ t:'pos', s }); };
  } else if (d.t === 'state'){
    if (RACE.on){ MP.players = d.players || {}; mpView(MP.players, MP.myId); }
  } else if (d.t === 'results'){
    mpResults(d.players || {}, MP.myId);
  } else if (d.t === 'bye'){ mpLost('L’hôte a quitté la partie.'); }
  else if (d.t === 'full'){ mpCleanup(); mpMenu('Cette partie est complète (8 joueurs).'); }
  else if (d.t === 'busy'){ mpCleanup(); mpMenu('Une course est déjà en cours dans cette partie. Réessaie à la fin de la course.'); }
}
function mpAct(act, b){
  if (act === 'online') return mpMenu();
  if (act === 'mp-back'){ mpCleanup(); raceStop(); return showTitle(); }
  if (act === 'mp-quit'){
    if (MP.role === 'host') mpBroadcast({ t:'bye' }); else if (MP.conn) MP.conn.send({ t:'bye' });
    const done = () => { mpCleanup(); raceStop(); mpMenu(); };
    return MP.role ? setTimeout(done, 150) : done();
  }
  if (act === 'mp-host'){ const n = readName(); return n ? mpHost(n) : mpMenu('Écris ton nom avant de continuer.'); }
  if (act === 'mp-join'){ const n = readName(), c = ($('#mpCode') || {}).value; return n ? mpJoin(n, c) : mpMenu('Écris ton nom avant de continuer.'); }
  if (act === 'mp-world'){ MP.world = +b.dataset.w; return mpLobbyRefresh(); }
  if (act === 'mp-start') return mpStartRace();
  if (act === 'mp-end') return mpEnd();
  if (act === 'mp-again'){ raceStop(); MP.ended = false; for (const p of Object.values(MP.players)) p.phase = 'wait'; mpShowLobby(); return mpLobbyRefresh(); }
}
mcard.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  e.preventDefault(); mpAct(e.target.id === 'mpCode' ? 'mp-join' : 'mp-host');
});
addEventListener('pagehide', () => { try { if (MP.role === 'host') mpBroadcast({ t:'bye' }); else if (MP.conn) MP.conn.send({ t:'bye' }); } catch (_) {} });

/* ================== Boucle ================== */
let lastT = 0, acc = 0;
function loop(t){
  requestAnimationFrame(loop);
  const dt = Math.min(.1, (t - lastT) / 1000 || 0); lastT = t;
  if (state === 'play'){ acc += dt; let n = 0; while (acc >= 1/60 && n < 6){ step(); acc -= 1/60; n++; if (state !== 'play') break; } }
  else acc = 0;
  if (LV){ const target = Math.max(0, Math.min(LV.W*TS - VW, P.x + P.w/2 - VW * .4)); camX += (target - camX) * .15; if (state === 'title') camX = 0; }
  wantMusic = (state === 'play' || state === 'question' || state === 'countdown') ? 'w' + world : state === 'boss' ? 'boss' : state === 'title' ? 'w0' : null;
  duck = state === 'question' || state === 'title';
  render();
  raceTick();
  if (state === 'boss' || !$('#bov').hidden){ if (bossShake > 0) bossShake--; if (bossFlash > 0) bossFlash--; drawBoss(t); }
}

/* ================== Démarrage ================== */
window.claude?.hot?.snapshot?.(() => ({ world, xp, lvl, maxHp, stats }));
function start(data){
  data = data || {};
  if (data.stats){ ({ world, xp, lvl } = data); stats = data.stats; }
  maxHp = START_HP; hp = maxHp;
  resize(); loadWorld(world || 0); if (QE_DUO) duoWait(); else showTitle();
  requestAnimationFrame(loop);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
